<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Roster Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Checkbox Styling */
        input[type="checkbox"] {
            accent-color: #059669; /* emerald-600 */
            width: 1.5rem;
            height: 1.5rem;
            cursor: pointer;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-emerald-50 text-slate-900 pb-safe">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CONFIGURATION ---
        // ANTI-LEAK PROTECTION: Paste first half of your key in PART_1, and second half in PART_2.
        const GEMINI_API_KEY_PART_1 = "AIzaSyAEVAMapvmCXc"; 
        const GEMINI_API_KEY_PART_2 = "ll1bfrrni5NmHo9lAl9gY";
        
        const GEMINI_API_KEY = GEMINI_API_KEY_PART_1 + GEMINI_API_KEY_PART_2; 
        const CLIENT_ID = "724634857433-lf5n8p0noabrpjl90f4f61nr6voqcp5n.apps.googleusercontent.com";
        const SCOPES = 'https://www.googleapis.com/auth/calendar';

        // --- Inline Icons ---
        const IconPlane = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>;
        const IconSync = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;

        function App() {
            const [gcalToken, setGcalToken] = useState(null);
            const [syncingAll, setSyncingAll] = useState(false);
            const [extracting, setExtracting] = useState(false);
            const [flights, setFlights] = useState([]);
            const [status, setStatus] = useState({ type: '', message: '' });
            const [logs, setLogs] = useState(["System Started (v6.6.0)"]);
            
            // Calendar Management States
            const [calendars, setCalendars] = useState([]);
            const [selectedCalendar, setSelectedCalendar] = useState('primary');
            const [isCreatingCalendar, setIsCreatingCalendar] = useState(false);
            const [newCalendarName, setNewCalendarName] = useState("");
            
            const fileInputRef = useRef(null);
            const tokenClient = useRef(null);
            const modelRef = useRef(null); 

            const addLog = (msg) => {
                console.log(msg);
                setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev]);
            };

            useEffect(() => {
                addLog("Initializing Google Identity...");
                const script = document.createElement('script');
                script.src = "https://accounts.google.com/gsi/client";
                script.async = true;
                script.defer = true;
                script.onload = () => {
                    if (window.google) {
                        try {
                            if (CLIENT_ID.includes("PASTE")) {
                                addLog("ERROR: Client ID is missing.");
                            } else {
                                tokenClient.current = window.google.accounts.oauth2.initTokenClient({
                                    client_id: CLIENT_ID,
                                    scope: SCOPES,
                                    callback: (response) => {
                                        if (response.error !== undefined) {
                                            setStatus({ type: 'error', message: 'Google Auth Error' });
                                            addLog(`Auth Error: ${response.error}`);
                                            return;
                                        }
                                        setGcalToken(response.access_token);
                                        setStatus({ type: 'success', message: 'Google Calendar Connected!' });
                                        addLog("Success: Google Calendar Token received.");
                                        fetchCalendars(response.access_token);
                                    },
                                });
                                addLog("Google Identity ready.");
                            }
                        } catch (err) { addLog(`GSI Init Error: ${err.message}`); }
                    }
                };
                document.body.appendChild(script);
            }, []);

            const handleGoogleAuth = () => {
                addLog("Attempting Google Login...");
                if (tokenClient.current) {
                    tokenClient.current.requestAccessToken({ prompt: 'consent' });
                } else {
                    setStatus({ type: 'error', message: 'Google library not ready.' });
                }
            };

            const fetchCalendars = async (token) => {
                addLog("Fetching available calendars...");
                try {
                    const res = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const writableCals = data.items.filter(c => c.accessRole === 'writer' || c.accessRole === 'owner');
                        setCalendars(writableCals);
                        const primaryCal = writableCals.find(c => c.primary);
                        if (primaryCal) setSelectedCalendar(primaryCal.id);
                        else if (writableCals.length > 0) setSelectedCalendar(writableCals[0].id);
                        addLog(`Found ${writableCals.length} writable calendars.`);
                    }
                } catch (err) {
                    addLog(`Calendar Fetch Error: ${err.message}`);
                }
            };

            const handleCreateCalendar = async () => {
                if (!newCalendarName.trim()) return;
                addLog(`Creating new calendar: ${newCalendarName}...`);
                try {
                    const response = await fetch('https://www.googleapis.com/calendar/v3/calendars', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${gcalToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ summary: newCalendarName.trim() })
                    });
                    if (response.ok) {
                        const newCal = await response.json();
                        setCalendars(prev => [...prev, newCal]);
                        setSelectedCalendar(newCal.id);
                        setIsCreatingCalendar(false);
                        setNewCalendarName("");
                        setStatus({ type: 'success', message: `Calendar "${newCal.summary}" created!` });
                    } else {
                        throw new Error("Failed to create calendar.");
                    }
                } catch (error) {
                    setStatus({ type: 'error', message: `Calendar creation failed.` });
                    addLog(`Calendar Creation Error: ${error.message}`);
                }
            };

            const callGemini = async (promptText, base64Image = null) => {
                if (!modelRef.current) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
                        if (!res.ok) throw new Error("Failed to fetch models.");
                        const data = await res.json();
                        const valid = (data.models || []).filter(m => m.name.includes("gemini") && m.supportedGenerationMethods?.includes("generateContent"));
                        const target = valid.find(m => m.name.includes("1.5-flash")) || valid.find(m => m.name.includes("2.5-flash")) || valid.find(m => m.name.includes("2.0-flash")) || valid[0];
                        modelRef.current = target.name;
                    } catch (e) {
                        addLog(`Model Discovery Error: ${e.message}`);
                        throw e;
                    }
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/${modelRef.current}:generateContent?key=${GEMINI_API_KEY}`;
                const parts = [{ text: promptText }];
                if (base64Image) parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });

                const payload = { contents: [{ parts }] };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                } else {
                    const err = await response.json();
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result.split(',')[1];
                    extractFlightData(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const processTripsAndSectors = (rawFlights) => {
                // Ensure flights are sorted by departure time
                const sortedFlights = [...rawFlights].sort((a, b) => new Date(a.isoDeparture) - new Date(b.isoDeparture));
                if (sortedFlights.length === 0) return [];

                // Detect home base from the very first flight in the roster
                const homeBase = sortedFlights[0].departureCode;
                addLog(`Detected Home Base as: ${homeBase}`);

                let trips = [];
                let currentTrip = [];

                // Group flights into Trips
                for (let i = 0; i < sortedFlights.length; i++) {
                    const flight = sortedFlights[i];
                    currentTrip.push(flight);
                    
                    const nextFlight = sortedFlights[i + 1];
                    let endOfTrip = false;
                    
                    // A trip ends when you arrive back at your Home Base
                    if (flight.arrivalCode === homeBase) {
                        endOfTrip = true;
                    } 
                    // Or if it's the very last flight in the list
                    else if (!nextFlight) {
                        endOfTrip = true;
                    }

                    if (endOfTrip) {
                        trips.push(currentTrip);
                        currentTrip = [];
                    }
                }

                // Process each trip to calculate "Daily Flight", "3 Days Trip", and Sector numbers
                const enrichedFlights = [];
                trips.forEach(trip => {
                    if (trip.length === 0) return;
                    
                    const start = new Date(trip[0].isoDeparture);
                    const end = new Date(trip[trip.length - 1].isoArrival);
                    
                    // Strip the time to calculate raw calendar day difference
                    const startDate = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                    const endDate = new Date(end.getFullYear(), end.getMonth(), end.getDate());
                    const dayDiff = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24));
                    
                    let tripTypeStr = "";
                    if (dayDiff === 0) tripTypeStr = "Daily Flight";
                    else tripTypeStr = `${dayDiff + 1} Days Trip`;

                    // Apply labels to each flight inside this trip
                    trip.forEach((f, idx) => {
                        f.tripType = tripTypeStr;
                        f.sectorString = trip.length === 1 ? 'Sector 1' : `Sector ${idx + 1} of ${trip.length}`;
                        f.selected = true; // Default selected for syncing
                        enrichedFlights.push(f);
                    });
                });

                return enrichedFlights;
            };

            const extractFlightData = async (base64Image) => {
                if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("PASTE")) {
                    setStatus({ type: 'error', message: 'API Key missing in code.' });
                    return;
                }
                
                setExtracting(true);
                setStatus({ type: 'info', message: 'AI is scanning your roster...' });
                setFlights([]);
                
                const prompt = `Extract all flights from this roster image into a raw JSON array.
                CRITICAL INSTRUCTION - You MUST use exactly this structure for each flight:
                [
                    {
                        "flightNumber": "MH 158",
                        "departureCode": "KUL",
                        "arrivalCode": "MED",
                        "departureCity": "Kuala Lumpur",
                        "arrivalCity": "Medina",
                        "arrivalAirportFull": "King Abdulaziz International Airport",
                        "departureTime24h": "14:30",
                        "arrivalTime24h": "18:45",
                        "isoDeparture": "2026-02-24T14:30:00+08:00",
                        "isoArrival": "2026-02-24T18:45:00+03:00"
                    }
                ]
                Ensure times are calculated correctly. Output ONLY raw JSON.`;

                try {
                    let text = await callGemini(prompt, base64Image);
                    text = text.replace(/```json\n?|```/g, "").trim();
                    let parsed = JSON.parse(text);
                    if (parsed.flights && Array.isArray(parsed.flights)) parsed = parsed.flights;
                    
                    // Process Trips and Sectors using our smart engine
                    const rawFlightArray = Array.isArray(parsed) ? parsed : [parsed];
                    const processedFlights = processTripsAndSectors(rawFlightArray);
                    
                    setFlights(processedFlights);
                    setStatus({ type: 'success', message: `Found ${processedFlights.length} flights!` });
                } catch (error) {
                    setStatus({ type: 'error', message: `Extraction failed. Check logs.` });
                    addLog(`Extraction Failed: ${error.message}`);
                } finally {
                    setExtracting(false);
                }
            };

            const toggleFlightSelection = (index) => {
                const newFlights = [...flights];
                newFlights[index].selected = !newFlights[index].selected;
                setFlights(newFlights);
            };

            const toggleAll = (selectState) => {
                setFlights(flights.map(f => ({ ...f, selected: selectState })));
            };

            const syncEventToAPI = async (flight) => {
                if (!gcalToken) throw new Error("Calendar not connected.");
                const event = {
                    'summary': `✈️ (${flight.flightNumber || 'Flight'}) ${flight.departureCode || ''} → ${flight.arrivalCode || ''}`,
                    'location': flight.arrivalAirportFull || flight.arrivalCity || '',
                    'description': `${flight.flightNumber || 'Flight'} from ${flight.departureCity || ''} to ${flight.arrivalCity || ''}\n\nType: ${flight.tripType}\nSector: ${flight.sectorString}`,
                    'start': { 'dateTime': flight.isoDeparture },
                    'end': { 'dateTime': flight.isoArrival },
                };
                const encodedCalendarId = encodeURIComponent(selectedCalendar);
                const response = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodedCalendarId}/events`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${gcalToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "Google Calendar API rejected the request.");
                }
            };

            const syncSelected = async () => {
                if (!gcalToken) return handleGoogleAuth();
                const toSync = flights.filter(f => f.selected);
                if (toSync.length === 0) {
                    setStatus({ type: 'error', message: 'No flights selected to sync.' });
                    return;
                }
                setSyncingAll(true);
                addLog(`Starting sync for ${toSync.length} flights...`);
                try {
                    for (const f of toSync) await syncEventToAPI(f);
                    setStatus({ type: 'success', message: `Successfully synced ${toSync.length} flights! ✨` });
                } catch (e) {
                    setStatus({ type: 'error', message: `Sync failed: ${e.message}` });
                    addLog(`Sync Failed: ${e.message}`);
                } finally {
                    setSyncingAll(false);
                }
            };

            const selectedCount = flights.filter(f => f.selected).length;

            return (
                <div className="min-h-screen p-4 md:p-8 pb-32 md:pb-64 max-w-3xl mx-auto">
                    
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-end gap-5 mb-8 animate-in">
                        <div>
                            <h1 className="text-3xl md:text-4xl font-black text-emerald-950 flex items-center gap-3 tracking-tighter">
                                <span className="p-2.5 bg-emerald-600 rounded-xl text-white shadow-xl"><IconPlane /></span> 
                                Sync Roster
                            </h1>
                        </div>
                        <div className="w-full md:w-auto">
                            {!gcalToken ? (
                                <button onClick={handleGoogleAuth} className="w-full md:w-auto bg-white border-2 border-emerald-100 text-emerald-700 px-6 py-3 rounded-2xl font-black shadow-sm hover:border-emerald-300 transition-all active:scale-95">
                                    Connect Calendar
                                </button>
                            ) : (
                                <div className="flex flex-col items-start md:items-end gap-2 bg-emerald-50 md:bg-transparent p-3 md:p-0 rounded-2xl md:rounded-none">
                                    <div className="bg-emerald-100/80 px-4 py-2 rounded-xl border border-emerald-200 text-[10px] md:text-xs font-black text-emerald-800 uppercase flex items-center gap-2">
                                        <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                                        Calendar Connected
                                    </div>
                                    
                                    <div className="flex flex-col items-start md:items-end gap-2 w-full">
                                        {!isCreatingCalendar ? (
                                            <div className="flex items-center gap-2 w-full md:w-auto">
                                                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest hidden md:inline">Sync to:</span>
                                                {calendars.length > 0 ? (
                                                    <select 
                                                        value={selectedCalendar}
                                                        onChange={(e) => setSelectedCalendar(e.target.value)}
                                                        className="flex-1 md:flex-none bg-white border border-emerald-200 text-emerald-800 text-xs font-bold rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer max-w-full md:max-w-[160px] truncate shadow-sm"
                                                    >
                                                        {calendars.map(cal => <option key={cal.id} value={cal.id}>{cal.summary}</option>)}
                                                    </select>
                                                ) : (
                                                    <span className="text-[10px] text-red-500 font-bold">No calendars</span>
                                                )}
                                                <button onClick={() => setIsCreatingCalendar(true)} className="text-[10px] font-black uppercase text-emerald-600 hover:text-emerald-800 bg-emerald-100 px-3 py-2 rounded-lg transition-colors shadow-sm whitespace-nowrap">
                                                    + New
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 w-full md:w-auto">
                                                <input 
                                                    type="text" placeholder="Calendar Name" value={newCalendarName} onChange={(e) => setNewCalendarName(e.target.value)}
                                                    className="flex-1 md:flex-none bg-white border border-emerald-200 text-emerald-800 text-xs font-bold rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-emerald-500 w-full md:w-[140px] shadow-sm" autoFocus
                                                />
                                                <button onClick={handleCreateCalendar} className="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm">Save</button>
                                                <button onClick={() => setIsCreatingCalendar(false)} className="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg shadow-sm">✕</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Upload Section */}
                    <section className="bg-white/80 backdrop-blur-xl rounded-3xl md:rounded-[3rem] shadow-xl border border-white p-6 md:p-10 mb-8 text-center">
                        <div onClick={() => !extracting && fileInputRef.current?.click()} className={`border-2 md:border-4 border-dashed rounded-2xl md:rounded-[2.5rem] p-8 md:p-12 transition-all cursor-pointer ${extracting ? 'bg-emerald-50/80 border-emerald-300 animate-pulse' : 'hover:bg-slate-50 border-slate-200 bg-slate-50/50'}`}>
                            <input type="file" className="hidden" ref={fileInputRef} accept="image/*" onChange={handleImageUpload} disabled={extracting} />
                            {extracting ? (
                                <p className="text-xl md:text-2xl font-black text-emerald-900 italic">Reading Roster...</p>
                            ) : (
                                <div>
                                    <p className="text-xl md:text-3xl font-black text-slate-800 tracking-tight">Tap to upload Roster</p>
                                    <p className="text-[10px] md:text-xs font-bold text-slate-400 mt-2 uppercase tracking-widest">Screenshot (PNG/JPG)</p>
                                </div>
                            )}
                        </div>
                        {status.message && (
                            <div className={`mt-6 p-4 rounded-2xl font-bold text-xs md:text-sm text-center border ${status.type === 'error' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-emerald-50 text-emerald-800 border-emerald-100'}`}>
                                {status.message}
                            </div>
                        )}
                    </section>

                    {/* Selection Controls */}
                    {flights.length > 0 && (
                        <div className="mb-6 flex justify-between items-center px-2 bg-slate-100/50 p-3 rounded-2xl">
                            <div className="flex gap-4">
                                <button onClick={() => toggleAll(true)} className="text-[10px] md:text-xs font-black uppercase tracking-widest text-emerald-700 hover:text-emerald-900 px-2 py-1">Select All</button>
                                <span className="text-slate-300">|</span>
                                <button onClick={() => toggleAll(false)} className="text-[10px] md:text-xs font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 px-2 py-1">None</button>
                            </div>
                            <span className="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest bg-white px-3 py-1 rounded-full shadow-sm">{selectedCount} Selected</span>
                        </div>
                    )}

                    {/* Flight Cards Grid */}
                    <div className="space-y-4 md:space-y-8 mb-24">
                        {flights.map((f, i) => (
                            <div key={i} className={`bg-white rounded-3xl md:rounded-[3rem] shadow-lg border-2 flex flex-col p-5 md:p-10 animate-in transition-all relative overflow-hidden ${f.selected ? 'border-emerald-400 shadow-emerald-900/10' : 'border-slate-100 opacity-70'}`}>
                                
                                {/* Top Row: Badges & Checkbox */}
                                <div className="flex justify-between items-start mb-4">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <div className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm">
                                            {f.tripType}
                                        </div>
                                        <div className="px-3 py-1 bg-slate-100 text-slate-600 rounded-lg text-[10px] font-bold uppercase tracking-widest shadow-sm">
                                            {f.sectorString}
                                        </div>
                                    </div>
                                    <input type="checkbox" checked={f.selected} onChange={() => toggleFlightSelection(i)} className="w-6 h-6 z-10 flex-shrink-0 ml-2 mt-1" />
                                </div>

                                {/* Raw Error Display */}
                                {!f.flightNumber && !f.departureCode && (
                                    <div className="absolute inset-0 bg-red-50/95 p-4 overflow-auto text-[10px] font-mono text-red-900 z-0 pt-16">
                                        <p className="font-black text-red-600 uppercase mb-2">RAW AI OUTPUT</p>
                                        {JSON.stringify(f, null, 2)}
                                    </div>
                                )}
                                
                                {/* Middle: Flight Info */}
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-0 mt-2">
                                    <div>
                                        <div className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter tabular-nums mb-1">
                                            ({f.flightNumber || "N/A"})
                                        </div>
                                        <div className="text-sm md:text-lg font-bold text-emerald-600/70 uppercase tracking-tight">
                                            {f.departureCode || "---"} → {f.arrivalCode || "---"}
                                        </div>
                                    </div>

                                    {/* Bottom: Times & Sync Button */}
                                    <div className="flex items-center justify-between md:flex-col md:items-end border-t border-slate-100 md:border-0 pt-4 md:pt-0 gap-4">
                                        <div className="text-left md:text-right flex-1">
                                            <div className="text-2xl md:text-3xl font-black text-emerald-950 tabular-nums">
                                                {f.departureTime24h || f.departureTimeAMPM || "00:00"}
                                            </div>
                                            <div className="text-[10px] font-black text-slate-400 uppercase mt-1 leading-tight max-w-[180px] md:max-w-none truncate">
                                                {f.arrivalAirportFull || f.arrivalCity || "Unknown"}
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => syncEventToAPI(f).then(() => setStatus({type:'success', message: `Synced ${f.flightNumber}!`})).catch(e => setStatus({type:'error', message: e.message}))} 
                                            className="bg-emerald-600 text-white h-12 w-12 md:h-16 md:w-16 rounded-xl md:rounded-[2rem] flex items-center justify-center shadow-lg active:scale-90 text-xl flex-shrink-0"
                                        >
                                            <IconPlus />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Fixed Sync Button */}
                    {flights.length > 0 && (
                        <div className="fixed bottom-0 left-0 right-0 p-4 pt-12 pb-safe bg-gradient-to-t from-white via-white/90 to-transparent z-50 flex justify-center backdrop-blur-sm pointer-events-none">
                            <button 
                                onClick={syncSelected} 
                                disabled={syncingAll || selectedCount === 0} 
                                className="max-w-md w-full bg-emerald-900 text-white py-5 rounded-3xl font-black shadow-2xl active:scale-95 text-lg flex items-center justify-center gap-3 disabled:bg-slate-300 disabled:text-slate-500 transition-all pointer-events-auto"
                            >
                                <IconSync /> 
                                {syncingAll ? 'Syncing...' : `Sync ${selectedCount} Selected ✨`}
                            </button>
                        </div>
                    )}

                    {/* Diagnostic Logs */}
                    <div className="mt-16 bg-slate-900 rounded-2xl p-5 shadow-inner">
                        <div className="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                            <h3 className="text-[10px] font-black uppercase text-emerald-400 tracking-widest">Logs</h3>
                            <span className="text-[10px] text-slate-500 font-mono">v6.6.0</span>
                        </div>
                        <div className="space-y-1.5 max-h-32 overflow-y-auto font-mono text-[10px]">
                            {logs.map((log, i) => (
                                <div key={i} className={`${log.includes("ERROR") || log.includes("Failed") ? "text-red-400" : "text-emerald-300/80"}`}>
                                    {log}
                                </div>
                            ))}
                        </div>
                    </div>

                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
